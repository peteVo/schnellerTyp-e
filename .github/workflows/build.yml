name: Build and test
on: [push, pull_request]

jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DSCHNELLERTYPE_BUILD_APP=OFF -DSCHNELLERTYPE_WERROR=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  linux-input-method:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev libgtk-3-dev libwayland-dev libxkbcommon-dev
      - run: cmake -S . -B build -G Ninja -DSCHNELLERTYPE_BUILD_APP=OFF -DSCHNELLERTYPE_BUILD_FCITX5=ON -DSCHNELLERTYPE_WERROR=ON -DSCHNELLERTYPE_BUILD_LINUX_DESKTOP_PROBES=ON -DCMAKE_INSTALL_PREFIX=/usr
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m py_compile tools/verify-linux-desktop.py tools/verify-omarchy-installed.py
      - name: Install desktop verification dependencies
        run: sudo apt-get install -y sway xwayland wl-clipboard dbus-x11 python3-websocket qt6-wayland fcitx5 fcitx5-frontend-qt6 fcitx5-frontend-gtk3 fcitx5-frontend-gtk4
      - name: Verify supported desktop clients
        run: python3 tools/verify-linux-desktop.py --build-dir build --browser google-chrome --clients gtk-wayland qt-wayland qt-xwayland chromium-xwayland
      - name: Compare rapid password input with addon enabled
        run: python3 tools/verify-linux-desktop.py --build-dir build --browser google-chrome --clients chromium-xwayland --key-delay-ms 5 --password-repeats 15
      - name: Compare rapid password input with plain Fcitx
        if: success() || failure()
        run: python3 tools/verify-linux-desktop.py --build-dir build --browser google-chrome --clients chromium-xwayland --engine keyboard --key-delay-ms 5 --password-repeats 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop-verification
          path: |
            build/desktop-verification-*/results.json
            build/desktop-verification-*/context.json
            build/desktop-verification-*/*.log
          if-no-files-found: ignore

  macos-input-method:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install qt
      - run: cmake -S . -B build -DSCHNELLERTYPE_BUILD_APP=OFF -DSCHNELLERTYPE_BUILD_MACOS_INPUT_METHOD=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DSCHNELLERTYPE_WERROR=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
